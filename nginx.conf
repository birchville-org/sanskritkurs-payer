server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Authelia Zero-PAT Broker für QA Viewer
    location /api/qa/ {
        proxy_pass http://127.0.0.1:8081/api/qa/;
        proxy_set_header Host $host;
        proxy_set_header Remote-User   $http_remote_user;
        proxy_set_header Remote-Name   $http_remote_name;
        proxy_set_header Remote-Email  $http_remote_email;
        proxy_set_header Remote-Groups $http_remote_groups;
    }

    # Unterstützung für Clean URLs (VitePress default)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Custom 404 Seite
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Caching für Bilder und Assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Gzip Kompression für schnellere Ladezeiten
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
