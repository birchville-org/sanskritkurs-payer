name: Dual-Target Release (GitHub Pages + Multi-Arch Docker)

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_OPTIONS: "--max-old-space-size=32768"

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Swap Space (32 GB)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 32G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=32768
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Configure Git for HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build VitePress (Docker Root Base)
        run: |
          npm ci
          NODE_OPTIONS="--max-old-space-size=32768" VITEPRESS_ENV=public npx vitepress build docs
          node scripts/gen_locale_manifests.mjs
          mv docs/.vitepress/dist docs/.vitepress/dist-public

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (Public)
        id: meta-public
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push Public image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: BUILD_DIR=dist-public
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-public.outputs.tags }}
          labels: ${{ steps.meta-public.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Swap Space (32 GB)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 32G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=32768
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build VitePress (GitHub Pages Subpath)
        run: |
          npm ci
          NODE_OPTIONS="--max-old-space-size=32768" VITEPRESS_ENV=public VITEPRESS_BASE=/sanskritkurs-payer/ npx vitepress build docs
          VITEPRESS_BASE=/sanskritkurs-payer/ node scripts/gen_locale_manifests.mjs

      - name: Build MkDocs into /dev-docs/
        run: |
          uv run --with mkdocs-material --with mkdocs-static-i18n mkdocs build --strict -d docs/.vitepress/dist/dev-docs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
