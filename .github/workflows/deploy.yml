name: Multi-Platform Docker Build

on:
  push:
    tags: [ 'v*.*.*' ]
    paths:
      - 'docs/**'
      - 'package*.json'
      - 'Dockerfile'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build VitePress (Public)
        run: |
          npm install
          VITEPRESS_ENV=public npm run docs:build
          mv docs/.vitepress/dist docs/.vitepress/dist-public

      - name: Build VitePress (Author)
        run: |
          VITEPRESS_ENV=author npm run docs:build
          mv docs/.vitepress/dist docs/.vitepress/dist-author

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (Public)
        id: meta-public
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push Public image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: BUILD_DIR=dist-public
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-public.outputs.tags }}
          labels: ${{ steps.meta-public.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (Author)
        id: meta-author
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=author
            type=raw,value=author-{{sha}}

      - name: Build and push Author image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.author
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-author.outputs.tags }}
          labels: ${{ steps.meta-author.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
