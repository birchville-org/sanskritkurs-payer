name: CI Quality Gate & Staging Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_OPTIONS: "--max-old-space-size=32768"

jobs:
  validate-and-build:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          pip install lingua-language-detector

      - name: Run Pre-Push & Integrity Checks
        run: |
          python3 scripts/pre_push_check.py

      - name: Build VitePress (Public)
        run: |
          VITEPRESS_ENV=public npm run docs:build
          rm -rf docs/.vitepress/dist-public
          mv docs/.vitepress/dist docs/.vitepress/dist-public

      - name: 1. Deploy Local Live-Staging Container (Port 8080)
        run: |
          mkdir -p /home/marco/staging/sanskritkurs-payer/dist-public
          rsync -a --delete docs/.vitepress/dist-public/ /home/marco/staging/sanskritkurs-payer/dist-public/
          cp -f nginx.conf /home/marco/staging/sanskritkurs-payer/nginx.conf
          XDG_RUNTIME_DIR=/run/user/$(id -u) systemctl --user restart payer-staging.service || true

      - name: 2. Run Mobile Layout & Internal Link Audit
        run: |
          python3 scripts/audit_mobile_links.py || true

      - name: 3. Run Quality Scoring & Coherence Benchmark
        run: |
          python3 scripts/score_translation_quality.py || true

      - name: 4. Run Background QA & German Remnant Scan
        run: |
          python3 scripts/qa_german_remnants.py || true

      - name: 5. Update Vector Search Embedding Index
        run: |
          python3 scripts/build_vector_index.py || true

      - name: 6. Backup Translation Memory & Vault
        run: |
          mkdir -p /home/marco/payer_backups
          tar -czf /home/marco/payer_backups/tm_backup_$(date +%Y%m%d_%H%M%S).tar.gz .payer/tm/ 2>/dev/null || true
          ls -dt /home/marco/payer_backups/tm_backup_*.tar.gz 2>/dev/null | tail -n +11 | xargs rm -f 2>/dev/null || true
